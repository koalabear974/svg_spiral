<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motif Studio</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #1a1610; color: #f0ead8; min-height: 100vh; }

header {
  background: #2c2416; border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 14px 24px; display: flex; align-items: center; gap: 16px;
}
header h1 { font-family: Georgia, serif; font-size: 1.25rem; letter-spacing: 0.02em; }
header p  { font-size: 0.78rem; opacity: 0.5; }
header a  {
  margin-left: auto; font-size: 0.78rem; color: #c49a20; text-decoration: none;
  padding: 4px 12px; border: 1px solid rgba(196,154,32,0.4); border-radius: 20px;
}
header a:hover { background: rgba(196,154,32,0.1); }

main {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: rgba(255,255,255,0.06); height: calc(100vh - 54px); overflow: hidden;
}
@media (max-width: 700px) { main { grid-template-columns: 1fr; height: auto; overflow: auto; } }

.panel { background: #1a1610; padding: 20px; overflow-y: auto; }
.panel-title {
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: #7a6a5a; margin-bottom: 12px;
}

/* ── Inputs ── */
.url-row { display: flex; gap: 8px; margin-bottom: 10px; }
.url-row input {
  flex: 1; padding: 7px 11px; background: #2c2416;
  border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
  color: #f0ead8; font-size: 0.83rem; outline: none;
}
.url-row input:focus { border-color: rgba(196,154,32,0.5); }

.btn {
  padding: 7px 16px; background: #8b2020; border: none; border-radius: 6px;
  color: #fff; cursor: pointer; font-size: 0.83rem; white-space: nowrap;
  transition: background 0.12s;
}
.btn:hover { background: #a02828; }
.btn:disabled { background: #4a3030; cursor: default; }

.file-drop {
  display: flex; align-items: center; justify-content: center;
  border: 1px dashed rgba(255,255,255,0.2); border-radius: 6px;
  padding: 10px; font-size: 0.78rem; color: #7a6a5a; cursor: pointer;
  margin-bottom: 12px; transition: border-color 0.12s, background 0.12s;
}
.file-drop:hover, .file-drop.drag-over {
  border-color: #c49a20; background: rgba(196,154,32,0.05); color: #c49a20;
}
.file-drop input { display: none; }

.num-row { display: flex; gap: 8px; flex-wrap: wrap; }
.num-row label { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: #a09080; }
.num-input {
  width: 72px; padding: 5px 8px; background: #2c2416;
  border: 1px solid rgba(255,255,255,0.12); border-radius: 5px;
  color: #f0ead8; font-size: 0.82rem; outline: none;
}
.num-input:focus { border-color: rgba(196,154,32,0.5); }

/* ── Source canvas area ── */
.canvas-toolbar {
  display: flex; align-items: center; gap: 4px;
  background: #231e14; padding: 5px 8px;
  border-radius: 6px 6px 0 0; border: 1px solid rgba(255,255,255,0.07);
  border-bottom: none;
}
.zoom-level {
  font-size: 0.7rem; color: #7a6a5a; min-width: 38px; text-align: center;
}
.toolbar-sep { width: 1px; height: 16px; background: rgba(255,255,255,0.1); margin: 0 4px; }
.btn-icon {
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  background: none; border: none; color: #a09080; cursor: pointer; border-radius: 4px;
  font-size: 0.85rem; transition: background 0.1s, color 0.1s;
}
.btn-icon:hover { background: rgba(255,255,255,0.1); color: #f0ead8; }
.btn-icon.active { background: rgba(196,154,32,0.2); color: #c49a20; }

.source-canvas-area {
  background: #0e0b07; border-radius: 0 0 6px 6px;
  border: 1px solid rgba(255,255,255,0.07); overflow: hidden;
}
#sourceCanvas {
  display: block; width: 100%; height: 260px;
  cursor: grab; touch-action: none;
}
#sourceCanvas.crosshair { cursor: crosshair; }
#sourceCanvas.grabbing  { cursor: grabbing; }

.info-line { font-size: 0.72rem; color: #7a6a5a; margin: 6px 0 12px; min-height: 1em; }

/* ── Params ── */
.param-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.param-label { font-size: 0.75rem; color: #a09080; width: 72px; flex-shrink: 0; }
.param-row input[type=range] { flex: 1; accent-color: #8b2020; min-width: 80px; }
.param-val { font-size: 0.82rem; color: #f0ead8; min-width: 24px; text-align: right; }
.muted { font-size: 0.72rem; color: #7a6a5a; }
.toggle-label {
  display: flex; align-items: center; gap: 5px;
  cursor: pointer; font-size: 0.78rem; color: #a09080;
}
.toggle-label input[type=checkbox] { accent-color: #c49a20; width: 14px; height: 14px; }

/* ── Result canvas ── */
.result-wrap {
  background: #0e0b07; border-radius: 6px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  min-height: 80px; margin-bottom: 8px;
}
.result-wrap canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; }

/* ── Color swatches ── */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.swatch {
  display: flex; align-items: center; gap: 5px; font-size: 0.72rem;
  color: #a09080; background: #2c2416; padding: 4px 8px; border-radius: 4px;
}
.swatch-dot { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.15); }

/* ── Save row ── */
.save-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.save-row input[type=text] {
  flex: 1; min-width: 120px; padding: 7px 11px; background: #2c2416;
  border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
  color: #f0ead8; font-size: 0.83rem; outline: none;
}
.save-row input[type=text]:focus { border-color: rgba(196,154,32,0.5); }
#saveStatus { font-size: 0.75rem; color: #5a9a5a; }

/* ── Misc ── */
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.1); border-top-color: #c49a20;
  border-radius: 50%; animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { color: #4a3e32; font-size: 0.85rem; text-align: center; padding: 20px; }
.divider { height: 1px; background: rgba(255,255,255,0.06); margin: 18px 0; }
</style>
</head>
<body>

<header>
  <h1>Motif Studio</h1>
  <p>Extract cross-stitch grids from images</p>
  <a href="/motif_browser.html">← Library</a>
</header>

<main>
  <!-- ── LEFT: Source ──────────────────────────────────── -->
  <div class="panel">
    <div class="panel-title">Source Image</div>

    <div class="url-row">
      <input type="text" id="urlInput" placeholder="Paste image URL…">
      <button class="btn" id="loadBtn">Load</button>
    </div>

    <label class="file-drop" id="fileDrop">
      <input type="file" id="fileInput" accept="image/*">
      <span>or drop / select a file</span>
    </label>

    <!-- Canvas toolbar: zoom controls + crop mode -->
    <div class="canvas-toolbar">
      <button class="btn-icon" id="zoomOutBtn" title="Zoom out">−</button>
      <span class="zoom-level" id="zoomLevel">fit</span>
      <button class="btn-icon" id="zoomInBtn" title="Zoom in">+</button>
      <button class="btn-icon" id="fitBtn" title="Reset zoom">⊡</button>
      <div class="toolbar-sep"></div>
      <button class="btn-icon" id="cropModeBtn" title="Draw crop rectangle">✂</button>
      <button class="btn-icon" id="clearCropBtn" title="Clear crop">✕</button>
      <span class="muted" style="margin-left:4px" id="modeHint"></span>
    </div>
    <div class="source-canvas-area">
      <canvas id="sourceCanvas"></canvas>
    </div>
    <div class="info-line" id="sourceInfo">No image loaded — paste a URL or drop a file above</div>

    <div class="divider"></div>

    <div class="panel-title">Crop (pixels in source image)</div>
    <div class="num-row" style="margin-bottom:6px">
      <label>X <input class="num-input" type="number" id="cx" value="0" min="0"></label>
      <label>Y <input class="num-input" type="number" id="cy" value="0" min="0"></label>
      <label>W <input class="num-input" type="number" id="cw" value="0" min="0"></label>
      <label>H <input class="num-input" type="number" id="ch" value="0" min="0"></label>
    </div>
    <div class="info-line" id="cropInfo"></div>
  </div>

  <!-- ── RIGHT: Parameters + Result ───────────────────── -->
  <div class="panel">
    <div class="panel-title">Parameters</div>

    <div class="param-row">
      <span class="param-label">Colors</span>
      <input type="range" id="colorsSlider" min="2" max="8" value="4">
      <span class="param-val" id="colorsVal">4</span>
    </div>

    <div class="param-row">
      <span class="param-label">Cell size</span>
      <label class="toggle-label">
        <input type="checkbox" id="cellAuto" checked>Auto
      </label>
      <input class="num-input" type="number" id="cellInput" value="16" min="4" max="128" disabled style="width:60px">
      <span class="muted" id="cellHint">–</span>
    </div>

    <div class="param-row" id="minCellRow">
      <span class="param-label">Min cell</span>
      <input class="num-input" type="number" id="minCell" value="12" min="4" max="64" style="width:60px">
      <span class="muted">px  (auto lower bound)</span>
    </div>

    <div class="divider"></div>

    <div class="panel-title">Result</div>

    <div class="result-wrap" id="resultWrap">
      <div class="empty-state" id="resultEmpty">Load an image to begin</div>
      <canvas id="resultCanvas" style="display:none"></canvas>
    </div>

    <div class="info-line" id="resultInfo"></div>
    <div class="swatches" id="swatches"></div>

    <div class="save-row">
      <input type="text" id="nameInput" placeholder="motif_name">
      <button class="btn" id="copyBtn" style="display:none">Copy JSON</button>
      <button class="btn" id="saveBtn" style="display:none">Save to motifs/</button>
      <span id="saveStatus"></span>
    </div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════════════════

let rawPixels = null, rawW = 0, rawH = 0;
let sourceBitmap = null;   // OffscreenCanvas with raw image, cached for fast drawing
let lastResult  = null;    // { grid, hexColors, rows, cols, cell }
let extractTimer = null;

// Viewport (what region of the raw image is visible on the source canvas)
const SRC_H = 260;                   // canvas drawing height in CSS pixels
let CANVAS_W = 400, CANVAS_H = SRC_H;
let viewX = 0, viewY = 0;           // top-left corner in raw image coords
let viewScale = 1;                  // raw pixels per canvas pixel (>1 = zoomed out)
let fitScale  = 1;                  // viewScale that fits the whole image

// Interaction state
let cropMode  = false;
let isDragging = false;
let dragStartRaw = null;            // { x, y } in raw image coords, for both pan and crop
let tempCrop  = null;               // { x, y, w, h } while drawing crop rectangle

// DOM refs
const urlInput     = document.getElementById('urlInput');
const loadBtn      = document.getElementById('loadBtn');
const fileInput    = document.getElementById('fileInput');
const fileDrop     = document.getElementById('fileDrop');
const sourceCanvas = document.getElementById('sourceCanvas');
const sourceInfo   = document.getElementById('sourceInfo');
const cropInfo     = document.getElementById('cropInfo');
const cx = document.getElementById('cx'), cy = document.getElementById('cy');
const cw = document.getElementById('cw'), ch = document.getElementById('ch');
const zoomLevel    = document.getElementById('zoomLevel');
const zoomOutBtn   = document.getElementById('zoomOutBtn');
const zoomInBtn    = document.getElementById('zoomInBtn');
const fitBtn       = document.getElementById('fitBtn');
const cropModeBtn  = document.getElementById('cropModeBtn');
const clearCropBtn = document.getElementById('clearCropBtn');
const modeHint     = document.getElementById('modeHint');

const colorsSlider = document.getElementById('colorsSlider');
const colorsVal    = document.getElementById('colorsVal');
const cellAuto     = document.getElementById('cellAuto');
const cellInput    = document.getElementById('cellInput');
const cellHint     = document.getElementById('cellHint');
const minCell      = document.getElementById('minCell');

const resultCanvas = document.getElementById('resultCanvas');
const resultEmpty  = document.getElementById('resultEmpty');
const resultInfo   = document.getElementById('resultInfo');
const swatches     = document.getElementById('swatches');
const nameInput    = document.getElementById('nameInput');
const copyBtn      = document.getElementById('copyBtn');
const saveBtn      = document.getElementById('saveBtn');
const saveStatus   = document.getElementById('saveStatus');

// ═══════════════════════════════════════════════════════════════════════════════
// Canvas setup
// ═══════════════════════════════════════════════════════════════════════════════

function initCanvas() {
  CANVAS_W = sourceCanvas.clientWidth || 400;
  CANVAS_H = SRC_H;
  sourceCanvas.width  = CANVAS_W;
  sourceCanvas.height = CANVAS_H;
}
initCanvas();
window.addEventListener('resize', () => {
  initCanvas();
  if (rawPixels) { resetFit(); drawSource(); }
});

// ═══════════════════════════════════════════════════════════════════════════════
// Image loading
// ═══════════════════════════════════════════════════════════════════════════════

loadBtn.addEventListener('click', () => {
  const url = urlInput.value.trim();
  if (url) loadFromUrl(url);
});
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadBtn.click(); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFromFile(fileInput.files[0]); });
fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag-over'); });
fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag-over'));
fileDrop.addEventListener('drop', e => {
  e.preventDefault(); fileDrop.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadFromFile(file);
});

async function loadFromUrl(url) {
  setLoading(true);
  try {
    const res = await fetch('/proxy', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    await ingestDataUrl(data.dataUrl);
    const stem = url.split('/').pop().split('?')[0].replace(/\.[^.]+$/, '').replace(/[-\s]/g, '_').slice(0, 30);
    if (stem && !nameInput.value) nameInput.value = stem;
  } catch (e) { sourceInfo.textContent = '⚠ ' + e.message; }
  setLoading(false);
}

function loadFromFile(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = async e => {
      setLoading(true);
      await ingestDataUrl(e.target.result);
      const stem = file.name.replace(/\.[^.]+$/, '').replace(/[-\s]/g, '_').slice(0, 30);
      if (stem && !nameInput.value) nameInput.value = stem;
      setLoading(false); resolve();
    };
    reader.readAsDataURL(file);
  });
}

async function ingestDataUrl(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      // Store raw pixels
      const tmp = document.createElement('canvas');
      tmp.width = img.width; tmp.height = img.height;
      tmp.getContext('2d').drawImage(img, 0, 0);
      rawPixels = tmp.getContext('2d').getImageData(0, 0, img.width, img.height).data;
      rawW = img.width; rawH = img.height;

      // Cache bitmap for fast drawing
      sourceBitmap = tmp;

      // Reset viewport
      resetFit();
      drawSource();
      scheduleExtract(0);
      resolve();
    };
    img.src = dataUrl;
  });
}

function setLoading(on) {
  loadBtn.disabled = on;
  loadBtn.innerHTML = on ? '<span class="spinner"></span>' : 'Load';
}

// ═══════════════════════════════════════════════════════════════════════════════
// Viewport helpers
// ═══════════════════════════════════════════════════════════════════════════════

function resetFit() {
  fitScale  = Math.max(rawW / CANVAS_W, rawH / CANVAS_H);
  viewScale = fitScale;
  viewX = (rawW - CANVAS_W * viewScale) / 2;
  viewY = (rawH - CANVAS_H * viewScale) / 2;
  clampView();
  updateZoomLabel();
}

function clampView() {
  const maxX = rawW - CANVAS_W * viewScale;
  const maxY = rawH - CANVAS_H * viewScale;
  viewX = Math.max(Math.min(maxX, 0), Math.min(viewX, Math.max(maxX, 0)));
  viewY = Math.max(Math.min(maxY, 0), Math.min(viewY, Math.max(maxY, 0)));
}

function updateZoomLabel() {
  const ratio = fitScale / viewScale;  // 1 = fit, 2 = 2× zoom in
  zoomLevel.textContent = ratio <= 1.05 ? 'fit' : `${ratio.toFixed(1)}×`;
}

// Canvas → raw image coordinate
function canvasToRaw(cx, cy) {
  return [viewX + cx * viewScale, viewY + cy * viewScale];
}

function applyZoom(factor, pivotX, pivotY) {
  // pivot in canvas coords
  const [rawPX, rawPY] = canvasToRaw(pivotX, pivotY);
  const minScale = fitScale * 0.9;
  const maxScale = Math.max(rawW, rawH) / 8;
  viewScale = Math.max(minScale, Math.min(maxScale, viewScale * factor));
  viewX = rawPX - pivotX * viewScale;
  viewY = rawPY - pivotY * viewScale;
  clampView();
  updateZoomLabel();
}

// ═══════════════════════════════════════════════════════════════════════════════
// Source canvas drawing
// ═══════════════════════════════════════════════════════════════════════════════

function drawSource() {
  if (!sourceBitmap) return;

  CANVAS_W = sourceCanvas.width;
  CANVAS_H = sourceCanvas.height;

  const ctx = sourceCanvas.getContext('2d');
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // Draw visible region of raw image
  ctx.drawImage(
    sourceBitmap,
    viewX, viewY, CANVAS_W * viewScale, CANVAS_H * viewScale,
    0, 0, CANVAS_W, CANVAS_H
  );

  // ── Cell grid overlay ──
  if (lastResult) {
    const cell = lastResult.cell;
    const cellPx = cell / viewScale;  // cell size in canvas pixels
    const startRawX = Math.floor(viewX / cell) * cell;
    const startRawY = Math.floor(viewY / cell) * cell;
    const opacity = Math.min(1, cellPx / 4);  // fade when very zoomed out
    ctx.strokeStyle = `rgba(196,154,32,${(0.4 * opacity).toFixed(2)})`;
    ctx.lineWidth = 1;
    for (let rx = startRawX; rx < viewX + CANVAS_W * viewScale + cell; rx += cell) {
      const cx = Math.round((rx - viewX) / viewScale) + 0.5;
      ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, CANVAS_H); ctx.stroke();
    }
    for (let ry = startRawY; ry < viewY + CANVAS_H * viewScale + cell; ry += cell) {
      const cy = Math.round((ry - viewY) / viewScale) + 0.5;
      ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(CANVAS_W, cy); ctx.stroke();
    }
  }

  // ── Crop rectangle overlay ──
  const crop = tempCrop || getActiveCrop();
  if (crop && crop.w > 0 && crop.h > 0) {
    const rx = (crop.x - viewX) / viewScale;
    const ry = (crop.y - viewY) / viewScale;
    const rw = crop.w / viewScale;
    const rh = crop.h / viewScale;

    // Darken outside crop
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.clearRect(rx, ry, rw, rh);
    // Re-draw image in crop area (to remove the darkening)
    ctx.drawImage(sourceBitmap, crop.x, crop.y, crop.w, crop.h, rx, ry, rw, rh);
    // Crop border
    ctx.strokeStyle = '#c49a20';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(rx + 0.5, ry + 0.5, rw, rh);
    // Corner handles
    const hs = 6;
    ctx.fillStyle = '#c49a20';
    [[rx,ry],[rx+rw-hs,ry],[rx,ry+rh-hs],[rx+rw-hs,ry+rh-hs]].forEach(([hx,hy]) => {
      ctx.fillRect(hx, hy, hs, hs);
    });
    cropInfo.textContent = `crop: ${Math.round(crop.w)}×${Math.round(crop.h)}px at (${Math.round(crop.x)}, ${Math.round(crop.y)})`;
  } else {
    cropInfo.textContent = '';
  }

  sourceInfo.textContent = rawW && rawH ? `${rawW}×${rawH}px  ·  scroll to zoom, drag to pan` : '';
}

function getActiveCrop() {
  const x = parseInt(cx.value)||0, y = parseInt(cy.value)||0;
  const w = parseInt(cw.value)||0, h = parseInt(ch.value)||0;
  return (w > 0 && h > 0) ? { x, y, w, h } : null;
}

// ═══════════════════════════════════════════════════════════════════════════════
// Zoom controls
// ═══════════════════════════════════════════════════════════════════════════════

zoomOutBtn.addEventListener('click', () => { if (!rawPixels) return; applyZoom(1.4, CANVAS_W/2, CANVAS_H/2); drawSource(); });
zoomInBtn .addEventListener('click', () => { if (!rawPixels) return; applyZoom(1/1.4, CANVAS_W/2, CANVAS_H/2); drawSource(); });
fitBtn    .addEventListener('click', () => { if (!rawPixels) return; resetFit(); drawSource(); });

sourceCanvas.addEventListener('wheel', e => {
  if (!rawPixels) return;
  e.preventDefault();
  const rect = sourceCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (CANVAS_W / rect.width);
  const my = (e.clientY - rect.top)  * (CANVAS_H / rect.height);
  applyZoom(e.deltaY > 0 ? 1.15 : 1/1.15, mx, my);
  drawSource();
}, { passive: false });

// ═══════════════════════════════════════════════════════════════════════════════
// Crop mode
// ═══════════════════════════════════════════════════════════════════════════════

cropModeBtn.addEventListener('click', () => {
  cropMode = !cropMode;
  cropModeBtn.classList.toggle('active', cropMode);
  modeHint.textContent = cropMode ? 'drag to draw crop' : '';
  sourceCanvas.classList.toggle('crosshair', cropMode);
  sourceCanvas.classList.remove('grabbing');
});

clearCropBtn.addEventListener('click', () => {
  cx.value = cy.value = cw.value = ch.value = 0;
  tempCrop = null;
  drawSource();
  scheduleExtract(200);
});

// ═══════════════════════════════════════════════════════════════════════════════
// Mouse interaction (pan + crop draw)
// ═══════════════════════════════════════════════════════════════════════════════

function canvasPoint(e) {
  const rect = sourceCanvas.getBoundingClientRect();
  return [
    (e.clientX - rect.left) * (CANVAS_W / rect.width),
    (e.clientY - rect.top)  * (CANVAS_H / rect.height),
  ];
}

sourceCanvas.addEventListener('mousedown', e => {
  if (!rawPixels) return;
  e.preventDefault();
  isDragging = true;
  const [px, py] = canvasPoint(e);
  dragStartRaw = { x: viewX + px * viewScale, y: viewY + py * viewScale, vx: viewX, vy: viewY };
  if (!cropMode) sourceCanvas.classList.add('grabbing');
});

sourceCanvas.addEventListener('mousemove', e => {
  if (!isDragging || !rawPixels) return;
  const [px, py] = canvasPoint(e);

  if (cropMode) {
    // Draw crop rectangle from dragStart to current mouse position
    const rawX = viewX + px * viewScale;
    const rawY = viewY + py * viewScale;
    const x = Math.max(0, Math.min(dragStartRaw.x, rawX));
    const y = Math.max(0, Math.min(dragStartRaw.y, rawY));
    const w = Math.min(rawW - x, Math.abs(rawX - dragStartRaw.x));
    const h = Math.min(rawH - y, Math.abs(rawY - dragStartRaw.y));
    tempCrop = { x, y, w, h };
    drawSource();
  } else {
    // Pan: keep the grabbed raw point under the cursor
    viewX = dragStartRaw.x - px * viewScale;
    viewY = dragStartRaw.y - py * viewScale;
    clampView();
    drawSource();
  }
});

sourceCanvas.addEventListener('mouseup', e => {
  if (!isDragging) return;
  isDragging = false;
  sourceCanvas.classList.remove('grabbing');

  if (cropMode && tempCrop && tempCrop.w > 2 && tempCrop.h > 2) {
    // Commit crop to inputs
    cx.value = Math.round(tempCrop.x);
    cy.value = Math.round(tempCrop.y);
    cw.value = Math.round(tempCrop.w);
    ch.value = Math.round(tempCrop.h);
    tempCrop = null;
    // Exit crop mode after drawing
    cropMode = false;
    cropModeBtn.classList.remove('active');
    modeHint.textContent = '';
    sourceCanvas.classList.remove('crosshair');
    drawSource();
    scheduleExtract(300);
  }
  tempCrop = null;
});

sourceCanvas.addEventListener('mouseleave', () => {
  if (isDragging && !cropMode) { isDragging = false; sourceCanvas.classList.remove('grabbing'); }
});

// Crop inputs → redraw immediately
[cx, cy, cw, ch].forEach(el => el.addEventListener('input', () => { drawSource(); scheduleExtract(400); }));

// ═══════════════════════════════════════════════════════════════════════════════
// Extraction pipeline (cell detection + quantization — runs fully in JS)
// ═══════════════════════════════════════════════════════════════════════════════

function scheduleExtract(delay = 200) {
  clearTimeout(extractTimer);
  extractTimer = setTimeout(runExtract, delay);
}

function runExtract() {
  if (!rawPixels) return;

  const k   = parseInt(colorsSlider.value);
  const lo  = parseInt(minCell.value) || 12;
  const crop = getActiveCrop();

  let [pixels, w, h] = crop ? applyCrop(rawPixels, rawW, rawH, crop) : [rawPixels, rawW, rawH];

  // Cell size
  let cell;
  if (cellAuto.checked) {
    cell = detectCellSize(pixels, w, h, lo);
    cellInput.value = cell;
    cellHint.textContent = `detected ${cell}px`;
  } else {
    cell = parseInt(cellInput.value) || 16;
    cellHint.textContent = `${cell}px`;
  }

  // Sample grid + quantize
  const { colors: gridColors, rows, cols } = sampleGrid(pixels, w, h, cell);
  const { centers, labels } = kmeans(gridColors, k);

  // Sort by luminance (brightest = index 0 = background)
  const lum = centers.map(c => 0.299*c[0] + 0.587*c[1] + 0.114*c[2]);
  const order = lum.map((_,i)=>i).sort((a,b) => lum[b]-lum[a]);
  const inv = new Uint8Array(k);
  order.forEach((origC, newC) => inv[origC] = newC);

  const hexColors = order.map(i => toHex(centers[i]));
  const grid = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) row.push(inv[labels[r * cols + c]]);
    grid.push(row);
  }

  lastResult = { grid, hexColors, rows, cols, cell };
  renderResult();
  drawSource();  // re-draw to show cell grid overlay
}

// ── Crop helper ──
function applyCrop(pixels, w, h, { x, y, w: cw, h: ch }) {
  const out = new Uint8ClampedArray(cw * ch * 4);
  for (let r = 0; r < ch; r++) {
    for (let c = 0; c < cw; c++) {
      const si = ((y + r) * w + (x + c)) * 4;
      const di = (r * cw + c) * 4;
      out[di] = pixels[si]; out[di+1] = pixels[si+1];
      out[di+2] = pixels[si+2]; out[di+3] = 255;
    }
  }
  return [out, cw, ch];
}

// ── Cell detection ──
function scoreCellSize(pixels, w, h, s) {
  const rows = Math.floor(h / s), cols = Math.floor(w / s);
  if (rows < 3 || cols < 3) return Infinity;
  let total = 0, count = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let sR=0,sG=0,sB=0,sR2=0,sG2=0,sB2=0,n=0;
      for (let dr = 0; dr < s; dr++) for (let dc = 0; dc < s; dc++) {
        const p = ((r*s+dr)*w + (c*s+dc)) * 4;
        const R=pixels[p],G=pixels[p+1],B=pixels[p+2];
        sR+=R;sG+=G;sB+=B;sR2+=R*R;sG2+=G*G;sB2+=B*B;n++;
      }
      total += (Math.sqrt(Math.max(0,sR2/n-(sR/n)**2)) +
                Math.sqrt(Math.max(0,sG2/n-(sG/n)**2)) +
                Math.sqrt(Math.max(0,sB2/n-(sB/n)**2))) / 3;
      count++;
    }
  }
  return count ? total / count : Infinity;
}

function detectCellSize(pixels, w, h, lo, hi=64) {
  hi = Math.min(hi, Math.floor(Math.min(w, h) / 4));
  if (lo > hi) return lo;

  let varBest = lo, varBestScore = Infinity;
  const scores = {};
  for (let s = lo; s <= hi; s++) {
    const sc = scoreCellSize(pixels, w, h, s);
    scores[s] = sc;
    if (sc < varBestScore) { varBestScore = sc; varBest = s; }
  }

  // Autocorrelation of column mean
  const proj = new Float64Array(w);
  for (let col = 0; col < w; col++) {
    let sum = 0;
    for (let row = 0; row < h; row++) {
      const p = (row*w+col)*4; sum += pixels[p]+pixels[p+1]+pixels[p+2];
    }
    proj[col] = sum / (h * 3);
  }
  let mean = 0; for (let i = 0; i < w; i++) mean += proj[i]; mean /= w;
  for (let i = 0; i < w; i++) proj[i] -= mean;

  let acBest = lo, acBestVal = -Infinity;
  for (let lag = lo; lag <= Math.min(hi, w-2); lag++) {
    let ac = 0;
    for (let i = 0; i < w-lag; i++) ac += proj[i] * proj[i+lag];
    if (ac > acBestVal) { acBestVal = ac; acBest = lag; }
    else if (ac < acBestVal * 0.9 && acBest > lo) break;
  }

  const varAtAc = scores[acBest] ?? Infinity;
  return varAtAc < varBestScore * 1.5 ? acBest : varBest;
}

// ── Grid sampling ──
function sampleGrid(pixels, w, h, cell) {
  const rows = Math.floor(h / cell), cols = Math.floor(w / cell);
  const m = Math.max(1, Math.floor(cell / 4));
  const colors = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    let sR=0,sG=0,sB=0,n=0;
    for (let dr = m; dr < cell-m; dr++) for (let dc = m; dc < cell-m; dc++) {
      const p = ((r*cell+dr)*w + (c*cell+dc)) * 4;
      sR+=pixels[p]; sG+=pixels[p+1]; sB+=pixels[p+2]; n++;
    }
    colors.push(n > 0 ? [sR/n, sG/n, sB/n] : [0,0,0]);
  }
  return { colors, rows, cols };
}

// ── K-means++ ──
function sqDist(a, b) { return (a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2; }

function kmeans(points, k, maxIter=40) {
  const n = points.length;
  if (!n || k <= 0) return { centers: [], labels: new Uint8Array(0) };
  k = Math.min(k, n);

  // K-means++ init
  const chosen = [Math.floor(Math.random() * n)];
  while (chosen.length < k) {
    const dists = points.map(p => Math.min(...chosen.map(i => sqDist(p, points[i]))));
    let total = dists.reduce((a,b)=>a+b,0), r = Math.random() * total, added = false;
    for (let i = 0; i < n; i++) { r -= dists[i]; if (r<=0) { chosen.push(i); added=true; break; } }
    if (!added) chosen.push(Math.floor(Math.random() * n));
  }
  let centers = chosen.map(i => [...points[i]]);
  const labels = new Uint8Array(n);

  for (let iter = 0; iter < maxIter; iter++) {
    let changed = false;
    for (let i = 0; i < n; i++) {
      let best=0, bestD=Infinity;
      for (let c = 0; c < k; c++) { const d=sqDist(points[i],centers[c]); if(d<bestD){bestD=d;best=c;} }
      if (labels[i] !== best) { labels[i]=best; changed=true; }
    }
    if (!changed) break;
    const sums = Array.from({length:k},()=>[0,0,0]);
    const counts = new Uint32Array(k);
    for (let i=0;i<n;i++) { const c=labels[i]; sums[c][0]+=points[i][0];sums[c][1]+=points[i][1];sums[c][2]+=points[i][2];counts[c]++; }
    centers = sums.map((s,c) => counts[c]>0 ? s.map(v=>v/counts[c]) : centers[c]);
  }
  return { centers, labels };
}

function toHex(rgb) {
  return '#' + rgb.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
}

// ═══════════════════════════════════════════════════════════════════════════════
// Result rendering
// ═══════════════════════════════════════════════════════════════════════════════

function renderResult() {
  if (!lastResult) return;
  const { grid, hexColors, rows, cols } = lastResult;

  resultEmpty.style.display = 'none';
  resultCanvas.style.display = 'block';
  copyBtn.style.display = 'inline-block';
  saveBtn.style.display = 'inline-block';

  const MAX = 360;
  const cellPx = Math.max(2, Math.floor(MAX / Math.max(rows, cols)));
  resultCanvas.width  = cols * cellPx;
  resultCanvas.height = rows * cellPx;
  const ctx = resultCanvas.getContext('2d');
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    ctx.fillStyle = hexColors[grid[r][c]];
    ctx.fillRect(c*cellPx, r*cellPx, cellPx, cellPx);
  }

  resultInfo.textContent = `${cols}×${rows} cells · ${hexColors.length} colors · cell=${lastResult.cell}px`;

  swatches.innerHTML = hexColors.map((hex, i) => {
    const pct = Math.round(100 * lastResult.grid.flat().filter(v=>v===i).length / (rows*cols));
    return `<div class="swatch"><div class="swatch-dot" style="background:${hex}"></div>${hex}<span style="opacity:.5"> ${pct}%</span></div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════════════════════
// Parameter listeners
// ═══════════════════════════════════════════════════════════════════════════════

colorsSlider.addEventListener('input', () => { colorsVal.textContent = colorsSlider.value; scheduleExtract(200); });
colorsVal.textContent = colorsSlider.value;
cellAuto.addEventListener('change', () => { cellInput.disabled = cellAuto.checked; scheduleExtract(200); });
cellInput.addEventListener('input', () => scheduleExtract(400));
minCell  .addEventListener('input', () => scheduleExtract(400));

// ═══════════════════════════════════════════════════════════════════════════════
// Save / Copy
// ═══════════════════════════════════════════════════════════════════════════════

copyBtn.addEventListener('click', () => {
  if (!lastResult) return;
  navigator.clipboard.writeText(JSON.stringify(buildMotifJson(), null, 2))
    .then(() => { saveStatus.textContent = 'Copied!'; setTimeout(()=>saveStatus.textContent='',2000); });
});

saveBtn.addEventListener('click', async () => {
  if (!lastResult) return;
  const name = nameInput.value.trim().replace(/\s+/g,'_') || 'motif';
  saveStatus.textContent = '…';
  try {
    const res = await fetch('/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, motif: buildMotifJson(name) }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    saveStatus.textContent = `✓ ${data.saved} (${data.count} total)`;
  } catch (e) { saveStatus.textContent = '⚠ ' + e.message; }
});

function buildMotifJson(name) {
  const { grid, hexColors, rows, cols, cell } = lastResult;
  const fullStitches = [];
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) if (grid[r][c]>0) fullStitches.push({colorId:grid[r][c],x:c,y:r});
  return {
    name:         name || nameInput.value.trim() || 'motif',
    source:       urlInput.value.trim() || '',
    stitchWidth:  cols, stitchHeight: rows, cellSizePx: cell,
    colors:       hexColors.map((h,i)=>({colorId:i,hexValue:h})),
    grid, fullStitches,
  };
}
