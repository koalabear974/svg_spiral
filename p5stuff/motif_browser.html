<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balkan Embroidery Motif Catalog</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f5f0e8; color: #2c1810; min-height: 100vh; }

header { background: #2c1810; color: #f5f0e8; padding: 24px 32px 0; }
header h1 { font-family: Georgia, serif; font-size: 1.7rem; letter-spacing: 0.02em; }
header p { margin-top: 4px; opacity: 0.6; font-size: 0.85rem; }

.controls {
  display: flex; flex-wrap: wrap; gap: 20px; align-items: center;
  padding: 14px 32px; background: #2c1810;
  border-top: 1px solid rgba(255,255,255,0.1); margin-top: 16px;
}
.ctrl-group { display: flex; align-items: center; gap: 8px; }
.ctrl-label { color: rgba(245,240,232,0.45); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; }
.pill {
  padding: 4px 11px; border: 1px solid rgba(255,255,255,0.25); border-radius: 20px;
  background: transparent; color: #f5f0e8; cursor: pointer; font-size: 0.78rem;
  transition: background 0.12s, border-color 0.12s;
}
.pill:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.5); }
.pill.active { background: #8b2020; border-color: #8b2020; }
.pill.pal-active { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.6); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 14px; padding: 24px 32px;
}
.card {
  background: #fff; border-radius: 8px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(44,24,16,0.09);
  cursor: pointer; transition: transform 0.13s, box-shadow 0.13s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(44,24,16,0.16); }
.card.hidden { display: none; }
.card-canvas-wrap {
  background: #f5f0e8; display: flex; align-items: center;
  justify-content: center; padding: 16px; min-height: 148px;
}
.card-canvas-wrap canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.card-info { padding: 10px 12px 12px; border-top: 1px solid #f0ebe3; }
.card-name { font-family: Georgia, serif; font-size: 0.85rem; font-weight: bold; }
.card-name-en { font-size: 0.75rem; color: #7a6a5e; margin-top: 2px; }
.badge {
  display: inline-block; margin-top: 7px; padding: 2px 8px;
  border-radius: 10px; font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.06em;
}
.t-serbian    { background: #f0e8e8; color: #8b2020; }
.t-bulgarian  { background: #e8eef8; color: #1a3d8f; }
.t-romanian   { background: #faf0e0; color: #7a5c00; }
.t-bosnian    { background: #e8f0e8; color: #2d6a30; }
.t-macedonian { background: #f0e8f8; color: #5a1e8b; }
.t-pan-balkan { background: #efefef; color: #444; }
.t-kilim      { background: #f0ece0; color: #6b4c00; }
.t-generated  { background: #e8f4e8; color: #1a5c2a; }

/* Modal */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(44,24,16,0.55); z-index: 300;
  align-items: center; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: #fff; border-radius: 12px; max-width: 660px;
  width: calc(100% - 32px); max-height: 92vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.modal-head {
  padding: 20px 24px 14px; border-bottom: 1px solid #f0ebe3;
  display: flex; justify-content: space-between; align-items: flex-start;
}
.modal-title { font-family: Georgia, serif; font-size: 1.25rem; }
.modal-title-en { font-size: 0.85rem; color: #7a6a5e; margin-top: 3px; }
.modal-close {
  background: none; border: none; cursor: pointer;
  font-size: 1.3rem; color: #9a8a7e; padding-left: 16px; line-height: 1;
}
.modal-body { padding: 24px; display: flex; gap: 24px; flex-wrap: wrap; }
.modal-canvas-wrap {
  flex-shrink: 0; background: #f5f0e8; border-radius: 8px;
  padding: 20px; display: flex; align-items: center; justify-content: center;
}
.modal-canvas-wrap canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.modal-details { flex: 1; min-width: 200px; }
.modal-meta { font-size: 0.78rem; color: #9a8a7e; margin-bottom: 10px; }
.modal-desc { font-size: 0.875rem; line-height: 1.65; color: #3c2c20; margin-bottom: 14px; }
.modal-construction { font-size: 0.78rem; line-height: 1.6; color: #5c4a3e; font-family: monospace; background: #f9f5ef; padding: 10px 12px; border-radius: 6px; }
.modal-construction h4 { font-family: system-ui; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #9a8a7e; margin-bottom: 6px; font-weight: 600; }

@media (max-width: 520px) { .grid { padding: 16px; } .controls { padding: 14px 16px; } header { padding: 18px 16px 0; } }

/* ─── Cross-Stitch Viewer ──────────────────────────────────────── */
#xsViewer {
  display: none; position: fixed; inset: 0; z-index: 1000;
  flex-direction: column; background: #fff;
}
#xsViewer.open { display: flex; }
#xsToolbar {
  height: 44px; background: #2c1810; color: #f5f0e8;
  display: flex; align-items: center; padding: 0 16px; gap: 10px; flex-shrink: 0;
}
#xsMotifName {
  font-family: Georgia,serif; font-size: 0.95rem; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#xsZoomPct {
  font-size: 0.75rem; opacity: 0.65; min-width: 46px;
  text-align: right; font-variant-numeric: tabular-nums;
}
.xs-btn {
  padding: 4px 12px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
  background: transparent; color: #f5f0e8; cursor: pointer; font-size: 0.78rem;
}
.xs-btn:hover { background: rgba(255,255,255,0.12); }
.xs-btn.active { background: #8b2020; border-color: #8b2020; }
#xsMain { position: relative; flex: 1; overflow: hidden; }
#xsCanvas { position: absolute; inset: 0; display: block; cursor: grab; }
#xsCanvas.xs-select { cursor: crosshair; }
#xsCanvas.xs-dragging { cursor: grabbing; }
#xsRulerCorner {
  position: absolute; top: 0; left: 0; width: 28px; height: 20px;
  background: rgba(248,248,248,0.94); border-right: 1px solid #ddd;
  border-bottom: 1px solid #ddd; z-index: 5; pointer-events: none;
}
#xsRulerH {
  position: absolute; top: 0; left: 28px; right: 0; height: 20px;
  background: rgba(248,248,248,0.94); border-bottom: 1px solid #ddd;
  overflow: hidden; z-index: 4; pointer-events: none;
}
#xsRulerV {
  position: absolute; top: 20px; left: 0; bottom: 0; width: 28px;
  background: rgba(248,248,248,0.94); border-right: 1px solid #ddd;
  overflow: hidden; z-index: 4; pointer-events: none;
}
.xs-rlbl {
  position: absolute; font-size: 9px; color: #aaa;
  font-family: monospace; user-select: none; line-height: 1;
}
#xsRulerH .xs-rlbl { top: 5px; transform: translateX(-50%); }
#xsRulerV .xs-rlbl { left: 2px; transform: translateY(-50%); }
#xsInfoBar {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(44,24,16,0.88); color: #f5f0e8;
  padding: 7px 16px; font-size: 0.78rem;
  display: none; align-items: center; gap: 14px; flex-wrap: wrap; z-index: 5;
}
#xsInfoBar.active { display: flex; }
.xs-chip { display: inline-flex; align-items: center; gap: 5px; }
.xs-chip-dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0;
}
/* "Open in viewer" modal button */
#mOpenViewer {
  margin-top: 14px; padding: 7px 16px; border-radius: 6px;
  background: #2c1810; color: #f5f0e8; border: none; cursor: pointer;
  font-size: 0.82rem; display: none;
}
#mOpenViewer.visible { display: inline-block; }
#mOpenViewer:hover { background: #4a2e1e; }
/* Collapse sidebar while viewer open */
body.viewer-open #sidebar,
body.viewer-open .sidebar,
body.viewer-open nav { display: none !important; }
</style>

<body>

<header>
  <h1>Balkan Embroidery Motif Catalog</h1>
  <p>Traditional cross-stitch motifs from Serbian, Bulgarian, Romanian, Bosnian & Macedonian folk art</p>
  <div class="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">Filter</span>
      <div id="filters">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="serbian">Serbian</button>
        <button class="pill" data-filter="bulgarian">Bulgarian</button>
        <button class="pill" data-filter="romanian">Romanian</button>
        <button class="pill" data-filter="bosnian">Bosnian</button>
        <button class="pill" data-filter="macedonian">Macedonian</button>
        <button class="pill" data-filter="pan-balkan">Pan-Balkan</button>
        <button class="pill" data-filter="kilim">Kilim</button>

      </div>

      </div>
    </div>
  </div>
</header>

<div class="grid" id="grid"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-title-en" id="mTitleEn"></div>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-canvas-wrap"><canvas id="mCanvas"></canvas></div>
      <div class="modal-details">
        <div class="modal-meta" id="mMeta"></div>
        <div class="modal-desc" id="mDesc"></div>
        <div class="modal-construction">
          <h4>Construction Notes</h4>
          <div id="mConstruct"></div>
        </div>
        <button id="mOpenViewer">Open in cross-stitch viewer</button>
      </div>
    </div>
  </div>
</div>

<script>
// ─── PALETTES ────────────────────────────────────────────────────────────────
// Index 0=bg, 1=primary, 2=secondary, 3=accent
const PALETTES = {
  default:   ['#f5f0e8', '#b01e2e', '#2c1810', '#c49a20'],
  zmijanje:  ['#fffcf8', '#1a3a6b', '#2a5298', '#5070b0'],
  bulgarian: ['#f5f0e8', '#b01e2e', '#1a1a1a', '#7a1020'],
  romanian:  ['#f5f0e8', '#b01e2e', '#1a1a1a', '#1e5c2e'],
};
let pal = PALETTES.default;

// ─── MOTIF FUNCTIONS ─────────────────────────────────────────────────────────
// All take (col, row, w, h) → 0..3

function mStar8(col, row, w, h) {
  const lc = col - (w-1)/2, lr = row - (h-1)/2;
  const half = Math.floor(w/2);
  const h2 = Math.floor(half * 0.72);
  const d1 = Math.abs(lc) + Math.abs(lr);
  const d2 = Math.max(Math.abs(lc), Math.abs(lr));
  if (d1 > half && d2 > h2) return 0;
  if (d1 <= Math.floor(half * 0.28)) return 3;
  if (d1 <= Math.floor(half * 0.55) || d2 <= Math.floor(h2 * 0.5)) return 2;
  return 1;
}

function mElbetitsa(col, row, w, h) {
  const lc = col - (w-1)/2, lr = row - (h-1)/2;
  const half = Math.floor(w/2);
  const d2 = Math.max(Math.abs(lc), Math.abs(lr));
  if (d2 > half) return 0;
  const onH = Math.abs(lr) <= 1;
  const onV = Math.abs(lc) <= 1;
  const onD1 = Math.abs(lc - lr) <= 1;
  const onD2 = Math.abs(lc + lr) <= 1;
  if (!onH && !onV && !onD1 && !onD2) return 0;
  if (Math.abs(lc) <= 1 && Math.abs(lr) <= 1) return 3;
  if ((onD1 || onD2) && !onH && !onV) return 2;
  return 1;
}

function mRozeta(col, row, w, h) {
  const lc = col - (w-1)/2, lr = row - (h-1)/2;
  const half = Math.floor(w/2);
  const d2 = Math.max(Math.abs(lc), Math.abs(lr));
  if (d2 > half) return 0;
  if (d2 <= 1) return 3;
  const petalR = Math.floor(half * 0.45);
  const petalD = Math.floor(half * 0.58);
  const cardinal = [[0,-petalD],[0,petalD],[petalD,0],[-petalD,0]];
  for (const [px,py] of cardinal) {
    if (Math.abs(lc-px)+Math.abs(lr-py) <= petalR) return 1;
  }
  const diagD = Math.floor(half * 0.48);
  const diagR = Math.floor(half * 0.3);
  const diag = [[diagD,-diagD],[diagD,diagD],[-diagD,diagD],[-diagD,-diagD]];
  for (const [px,py] of diag) {
    if (Math.abs(lc-px)+Math.abs(lr-py) <= diagR) return 2;
  }
  return 0;
}

function mDiamond(col, row, w, h) {
  const lc = col - (w-1)/2, lr = row - (h-1)/2;
  const half = Math.floor(w/2);
  const d = Math.abs(lc) + Math.abs(lr);
  if (d > half) return 0;
  if (d <= Math.floor(half*0.25)) return 3;
  if (d <= Math.floor(half*0.55)) return 2;
  return 1;
}

function mDiamondLash(col, row, w, h) {
  // w=h=25, diamond half=9 with 3-cell eyelashes
  const lc = col - 12, lr = row - 12;
  const half = 9;
  const d = Math.abs(lc) + Math.abs(lr);
  if (d <= half) {
    if (d >= half-1) return 1;
    if (d <= 3) return 3;
    return 2;
  }
  for (let s = 1; s <= 3; s++) {
    if (lc === s && lr === -(half+s)) return 3;
    if (lc === -s && lr === -(half+s)) return 3;
    if (lc === s && lr === (half+s)) return 3;
    if (lc === -s && lr === (half+s)) return 3;
    if (lr === s && lc === (half+s)) return 3;
    if (lr === -s && lc === (half+s)) return 3;
    if (lr === s && lc === -(half+s)) return 3;
    if (lr === -s && lc === -(half+s)) return 3;
  }
  return 0;
}

function mTree(col, row, w, h) {
  // 19x31
  const cc = 9;
  const crownCr = 4, crownR = 3;
  const d = Math.abs(col-cc) + Math.abs(row-crownCr);
  if (d <= crownR) return d <= 1 ? 3 : 1;
  if (col === cc && row >= crownCr+crownR) return 2;
  const brs = [{r:12,l:4},{r:18,l:5},{r:24,l:6}];
  for (const {r,l} of brs) {
    const s = Math.abs(col-cc);
    if (s >= 1 && s <= l && row === r-s) return 3;
    if (s === l+1 && Math.abs(col-cc)+Math.abs(row-(r-l)) <= 1) return 1;
  }
  return 0;
}

function mFirTree(col, row, w, h) {
  // 11x21
  const cc = 5;
  if (col === cc) return 2;
  const s = Math.abs(col - cc);
  const maxLen = Math.min(5, Math.floor(row / 2) + 1);
  if (s >= 1 && s <= maxLen && row % 2 === 0 && row >= 2) {
    return s === maxLen ? 1 : 2;
  }
  return 0;
}

function mSunWheel(col, row, w, h) {
  const lc = col - (w-1)/2, lr = row - (h-1)/2;
  const half = Math.floor(w/2);
  const d2 = Math.max(Math.abs(lc), Math.abs(lr));
  if (d2 > half) return 0;
  if (d2 <= 1) return 3;
  const onC = Math.abs(lc) <= 1 || Math.abs(lr) <= 1;
  const onD = Math.abs(Math.abs(lc) - Math.abs(lr)) <= 1;
  if (d2 >= half-1) return 1;
  if (onC || onD) return 2;
  return 0;
}

function mMakCross(col, row, w, h) {
  // Macedonian cross with serif tips (15x15)
  const lc = col - 7, lr = row - 7;
  const half = 7;
  const d2 = Math.max(Math.abs(lc), Math.abs(lr));
  if (d2 > half) return 0;
  const onH = Math.abs(lr) <= 1 && Math.abs(lc) <= half;
  const onV = Math.abs(lc) <= 1 && Math.abs(lr) <= half;
  if (!onH && !onV) return 0;
  // Serif: widen arm tips
  if (Math.abs(lc) === half && Math.abs(lr) <= 2) return 1; // E/W tips
  if (Math.abs(lr) === half && Math.abs(lc) <= 2) return 1; // N/S tips
  if (Math.abs(lc) <= 1 && Math.abs(lr) <= 1) return 3; // center
  return 2;
}

function mZmija(col, row, w, h) {
  // Zmijanje kolo: hollow diamond + inner cross + corner hooks (19x19, single color)
  const lc = col - 9, lr = row - 9;
  const half = 8;
  const d = Math.abs(lc) + Math.abs(lr);
  if (d === half || d === half-1) return 1;
  if (d <= 4 && d >= 3) return 1;
  if (Math.abs(lc) <= 1 || Math.abs(lr) <= 1) {
    if (d <= half-2 && d >= 5) return 1;
  }
  if (d <= 1) return 1;
  for (let s = 1; s <= 3; s++) {
    if (lc === s && lr === -(half+s-1)) return 1;
    if (lc === -s && lr === -(half+s-1)) return 1;
    if (lc === s && lr === (half+s-1)) return 1;
    if (lc === -s && lr === (half+s-1)) return 1;
    if (lr === s && lc === -(half+s-1)) return 1;
    if (lr === -s && lc === -(half+s-1)) return 1;
    if (lr === s && lc === (half+s-1)) return 1;
    if (lr === -s && lc === (half+s-1)) return 1;
  }
  return 0;
}

function mEagle(col, row, w, h) {
  // Simplified double-headed eagle (21x21)
  const lc = col - 10, lr = row - 10;
  // Body
  if (Math.abs(lc) <= 2 && lr >= -2 && lr <= 5) return 1;
  // Wings
  if (Math.abs(lc) > 2 && lr >= -2 && lr <= 5) {
    const spread = 6 - Math.floor(Math.abs(lr - 1.5) * 0.9);
    if (Math.abs(lc) <= 2 + spread) return 2;
  }
  // Left head
  if (Math.abs(lc+6) + Math.abs(lr+5) <= 3) return 1;
  if (lc === -10 && lr === -5) return 3;
  if (lc === -6 && lr === -9) return 3;
  if (Math.abs(lc+6) <= 1 && lr === -9) return 3;
  // Right head
  if (Math.abs(lc-6) + Math.abs(lr+5) <= 3) return 1;
  if (lc === 10 && lr === -5) return 3;
  if (lc === 6 && lr === -9) return 3;
  if (Math.abs(lc-6) <= 1 && lr === -9) return 3;
  // Tail
  const ts = lr - 5;
  if (ts >= 1 && ts <= 4 && Math.abs(lc) <= Math.max(0, 2-ts+1)) return 1;
  return 0;
}

function mFrog(col, row, w, h) {
  // Simplified Pirot frog (15x15)
  const lc = col - 7, lr = row - 7;
  // Body
  if (Math.abs(lc) <= 3 && Math.abs(lr) <= 2) return 2;
  // Head
  if (Math.abs(lc) <= 2 && lr >= -4 && lr <= -3) return 1;
  if (Math.abs(lc) <= 1 && lr === -5) return 1;
  // Eyes
  if ((lc === -2 || lc === 2) && lr === -3) return 3;
  // Legs (4 diagonal arms)
  for (let s = 1; s <= 4; s++) {
    if (lc === -(3+s) && lr === -s) return 1;
    if (lc === (3+s) && lr === -s) return 1;
    if (lc === -s && lr === (2+s)) return 1;
    if (lc === s && lr === (2+s)) return 1;
  }
  // Feet
  for (let s = -1; s <= 1; s++) {
    if (lc === (-7+s) && lr === -4) return 3;
    if (lc === (7+s) && lr === -4) return 3;
    if (lc === (-4+s) && lr === 6) return 3;
    if (lc === (4+s) && lr === 6) return 3;
  }
  return 0;
}

function mMeander(col, row, w, h) {
  // Greek key unit (13x13, single color)
  const lc = col, lr = row;
  // Outer frame top
  if (lr === 0 && lc >= 0 && lc <= 10) return 1;
  if (lc === 10 && lr >= 0 && lr <= 8) return 1;
  if (lr === 8 && lc >= 4 && lc <= 10) return 1;
  if (lc === 4 && lr >= 4 && lr <= 8) return 1;
  if (lr === 4 && lc >= 0 && lc <= 4) return 1;
  if (lc === 0 && lr >= 0 && lr <= 12) return 1;
  if (lr === 12 && lc >= 0 && lc <= 12) return 1;
  if (lc === 12 && lr >= 4 && lr <= 12) return 1;
  if (lr === 4 && lc >= 8 && lc <= 12) return 1;
  if (lc === 8 && lr >= 4 && lr <= 8) return 1;
  return 0;
}

function mWolfTeeth(col, row, w, h) {
  // Wolf's teeth — triangular border stamp (13x13)
  const half = 6;
  // Three teeth pointing up, three pointing down (interlocked)
  const unit = 4;
  // Up teeth
  const uCol = col % unit;
  const uRow = row;
  if (uRow <= uCol && uRow <= (unit-1-uCol) && uRow <= half) return 1;
  // Down teeth (mirrored, offset)
  const dCol = (col + 2) % unit;
  if (uRow >= (h - 1 - dCol) && uRow >= (h - 1 - (unit-1-dCol)) && uRow >= half) return 2;
  return 0;
}

function mLoza(col, row, w, h) {
  // Vine border (13x13 single unit)
  const lc = col - 6, lr = row - 6;
  // Zigzag stem
  const phase = (row < h/2) ? 1 : -1;
  const stemDist = Math.abs(lc - phase * (lr));
  if (stemDist <= 1 && Math.abs(lr) <= 5) return 2;
  // Leaf diamonds at inflection points (lr near 0)
  if (Math.abs(lr) <= 2) {
    const ld = Math.abs(lc) + Math.abs(lr + (lc > 0 ? -2 : 2));
    if (ld <= 2) return 1;
  }
  if (Math.abs(lr) >= 4) {
    const ld = Math.abs(lc) + Math.abs(Math.abs(lr) - 5);
    if (ld <= 1) return 3;
  }
  return 0;
}

// ─── PIROT KILIM + ANATOLIAN KILIM MOTIFS ────────────────────────────────────

function mRasiceva(col, row, w, h) {
  // Rašićeva — 21×21. Pirot's most precise pattern: concentric diamond outlines.
  const lc = col - 10, lr = row - 10;
  const d = Math.abs(lc) + Math.abs(lr);
  if (d === 9) return 1;
  if (d === 7) return 2;
  if (d === 5) return 1;
  if (d === 3) return 2;
  if (d <= 1) return 3;
  return 0;
}

function mKornjaca(col, row, w, h) {
  // Turtle (kornjača) — 19×17. Wide diamond shell + 4 corner legs + head + tail.
  const lc = col - 9, lr = row - 8;
  const d = Math.abs(lc) + Math.abs(lr);
  if (d <= 5) return d <= 1 ? 3 : d <= 3 ? 2 : 1;
  for (let s = 1; s <= 2; s++) {
    if (lc === 5+s && Math.abs(lr) === s) return 1;
    if (lc === -(5+s) && Math.abs(lr) === s) return 1;
  }
  if (Math.abs(lc) <= 1 && lr === -7) return 1;
  if (lc === 0 && lr === -8) return 2;
  if (lc === 0 && lr === 7) return 1;
  return 0;
}

function mHobotnica(col, row, w, h) {
  // Octopus (hobotnica) — 21×21. Body + 4 cardinal bent arms + 4 diagonal arms.
  const lc = col - 10, lr = row - 10;
  const d = Math.abs(lc) + Math.abs(lr);
  if (d <= 3) return d <= 1 ? 3 : 2;
  const al = 4;
  if (lc === 0 && lr < -3 && lr >= -(3+al)) return 1;
  if (lr === -(3+al) && lc >= 1 && lc <= 3) return 1;
  if (lc === 0 && lr > 3 && lr <= 3+al) return 1;
  if (lr === 3+al && lc <= -1 && lc >= -3) return 1;
  if (lr === 0 && lc > 3 && lc <= 3+al) return 1;
  if (lc === 3+al && lr >= 1 && lr <= 3) return 1;
  if (lr === 0 && lc < -3 && lc >= -(3+al)) return 1;
  if (lc === -(3+al) && lr <= -1 && lr >= -3) return 1;
  for (let s = 4; s <= 7; s++) {
    if (Math.abs(lc) === s && Math.abs(lr) === s) return 2;
  }
  return 0;
}

function mNaocari(col, row, w, h) {
  // Eyeglasses (naočare) — 23×11. Two diamonds + nose bridge.
  const lc = col - 11, lr = row - 5;
  const half = 4;
  const dl = Math.abs(lc + 6) + Math.abs(lr);
  const dr = Math.abs(lc - 6) + Math.abs(lr);
  if (dl <= half) return dl <= 1 ? 3 : dl <= 3 ? 2 : 1;
  if (dr <= half) return dr <= 1 ? 3 : dr <= 3 ? 2 : 1;
  if (Math.abs(lc) <= 2 && lr === 0) return 1;
  return 0;
}

function mDjavKolena(col, row, w, h) {
  // Devil's Knees (đavolja kolena) — 15×16. Interlocking V-chevrons.
  const lc = col - 7;
  const chevH = 4;
  const block = row % (chevH * 2);
  const depth = block < chevH ? block : chevH * 2 - 1 - block;
  if (Math.abs(lc) <= depth) return block < chevH ? 1 : 2;
  return 0;
}

function mElibelinde(col, row, w, h) {
  // Elibelinde (hands on hips) — 15×23. Stylized goddess/fertility figure.
  const lc = col - 7, lr = row - 11;
  const hd = Math.abs(lc) + Math.abs(lr + 9);
  if (hd <= 2) return hd === 0 ? 3 : 1;
  if (Math.abs(lc) <= 1 && lr >= -7 && lr <= -3) return 2;
  if (lr === -5 && Math.abs(lc) >= 2 && Math.abs(lc) <= 5) return 1;
  if ((lr === -6 || lr === -7) && Math.abs(lc) === 5) return 1;
  const sk = lr + 2;
  if (sk >= 0 && sk <= 8 && Math.abs(lc) <= sk + 1) return sk % 2 === 0 ? 1 : 2;
  return 0;
}

function mKocboynuzu(col, row, w, h) {
  // Ram's Horn (koçboynuzu) — 13×13. Two opposing S-scroll diamonds.
  const lc = col - 6, lr = row - 6;
  const d1 = Math.abs(lc + 2) + Math.abs(lr + 2);
  if (d1 <= 5 && lc <= 1 && lr <= 1) return d1 <= 1 ? 3 : d1 <= 3 ? 2 : 1;
  const d2 = Math.abs(lc - 2) + Math.abs(lr - 2);
  if (d2 <= 5 && lc >= -1 && lr >= -1) return d2 <= 1 ? 3 : d2 <= 3 ? 2 : 1;
  return 0;
}

// ─── RENDERING ───────────────────────────────────────────────────────────────
function renderMotif(canvas, motif, cellPx) {
  canvas.width  = motif.gridW * cellPx;
  canvas.height = motif.gridH * cellPx;
  const ctx = canvas.getContext('2d');
  for (let row = 0; row < motif.gridH; row++) {
    for (let col = 0; col < motif.gridW; col++) {
      const v = motif.fn(col, row, motif.gridW, motif.gridH);
      ctx.fillStyle = pal[Math.min(v, pal.length-1)];
      ctx.fillRect(col*cellPx, row*cellPx, cellPx, cellPx);
    }
  }
}

function renderJsonMotif(canvas, motif, cellPx) {
  canvas.width  = motif.stitchWidth  * cellPx;
  canvas.height = motif.stitchHeight * cellPx;
  const ctx = canvas.getContext('2d');
  const colors = motif.colors.map(c => c.hexValue);
  for (let row = 0; row < motif.stitchHeight; row++) {
    for (let col = 0; col < motif.stitchWidth; col++) {
      const v = motif.grid[row][col];
      ctx.fillStyle = colors[Math.min(v, colors.length - 1)];
      ctx.fillRect(col * cellPx, row * cellPx, cellPx, cellPx);
    }
  }
}

function cellPxForCard(m) {
  return Math.max(5, Math.floor(144 / Math.max(m.gridW, m.gridH)));
}
function cellPxForModal(m) {
  return Math.max(10, Math.floor(280 / Math.max(m.gridW, m.gridH)));
}
function cellPxForJsonCard(m) {
  const maxDim = Math.max(m.stitchWidth, m.stitchHeight);
  return Math.max(2, Math.floor(144 / maxDim));
}
function cellPxForJsonModal(m) {
  const maxDim = Math.max(m.stitchWidth, m.stitchHeight);
  return Math.max(4, Math.floor(320 / maxDim));
}

// ─── BUILD GRID ──────────────────────────────────────────────────────────────
const grid = document.getElementById('grid');

function buildCards() {
  grid.innerHTML = '';

  for (const m of MOTIFS) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.tradition = m.tradition;
    card._motif = m;

    const wrap = document.createElement('div');
    wrap.className = 'card-canvas-wrap';
    const canvas = document.createElement('canvas');
    renderMotif(canvas, m, cellPxForCard(m));
    wrap.appendChild(canvas);

    const info = document.createElement('div');
    info.className = 'card-info';
    info.innerHTML = `
      <div class="card-name">${m.name}</div>
      <div class="card-name-en">${m.nameEn}</div>
      <span class="badge t-${m.tradition}">${m.tradition.replace('-',' ')}</span>
    `;

    card.appendChild(wrap);
    card.appendChild(info);
    card.addEventListener('click', () => openModal(m));
    grid.appendChild(card);
  }

  for (const m of (window.IMPORTED_MOTIFS || [])) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.tradition = 'generated';
    card._jsonMotif = m;

    const wrap = document.createElement('div');
    wrap.className = 'card-canvas-wrap';
    const canvas = document.createElement('canvas');
    renderJsonMotif(canvas, m, cellPxForJsonCard(m));
    wrap.appendChild(canvas);

    const info = document.createElement('div');
    info.className = 'card-info';
    const colorDots = m.colors.map(c =>
      `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.hexValue};margin-right:2px;border:1px solid #ccc"></span>`
    ).join('');
    info.innerHTML = `
      <div class="card-name">${m.name.replace(/_/g,' ')}</div>
      <div class="card-name-en">${m.stitchWidth}×${m.stitchHeight} cells · ${m.colors.length} colors</div>
      <span class="badge t-generated">generated</span>
      <div style="margin-top:6px">${colorDots}</div>
    `;

    card.appendChild(wrap);
    card.appendChild(info);
    card.addEventListener('click', () => openJsonModal(m));
    grid.appendChild(card);
  }
}

// ─── FILTER ──────────────────────────────────────────────────────────────────
let currentFilter = 'all';

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.pill');
  if (!btn) return;
  currentFilter = btn.dataset.filter;
  document.querySelectorAll('#filters .pill').forEach(b => b.classList.toggle('active', b === btn));
  applyFilter();
});

function applyFilter() {
  document.querySelectorAll('.card').forEach(card => {
    const show = currentFilter === 'all' || card.dataset.tradition === currentFilter;
    card.classList.toggle('hidden', !show);
  });
}

// ─── PALETTE ─────────────────────────────────────────────────────────────────
document.getElementById('palettes').addEventListener('click', e => {
  const btn = e.target.closest('.pill');
  if (!btn || !btn.dataset.pal) return;
  pal = PALETTES[btn.dataset.pal];
  document.querySelectorAll('#palettes .pill').forEach(b => b.classList.toggle('pal-active', b === btn));
  refreshCanvases();
});

function refreshCanvases() {
  for (const card of grid.querySelectorAll('.card')) {
    const canvas = card.querySelector('canvas');
    if (!canvas) continue;
    if (card._motif) renderMotif(canvas, card._motif, cellPxForCard(card._motif));
  }
  if (activeMotif) renderMotif(document.getElementById('mCanvas'), activeMotif, cellPxForModal(activeMotif));
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
let activeMotif = null;
const modalBg = document.getElementById('modalBg');

function openModal(m) {
  activeMotif = m;
  activeJsonMotif = null;
  document.getElementById('mTitle').textContent = m.name;
  document.getElementById('mTitleEn').textContent = m.nameEn;
  document.getElementById('mMeta').textContent = `${m.tradition.replace('-',' ')} · ${m.gridW}×${m.gridH} cells · ${m.tradition === 'bosnian' ? '1 color' : '3 colors'}`;
  document.getElementById('mDesc').textContent = m.desc;
  document.getElementById('mConstruct').textContent = m.notes;
  const mc = document.getElementById('mCanvas');
  renderMotif(mc, m, cellPxForModal(m));
  modalBg.classList.add('open');
}

let activeJsonMotif = null;

function openJsonModal(m) {
  activeJsonMotif = m;
  activeMotif = null;
  document.getElementById('mTitle').textContent = m.name.replace(/_/g, ' ');
  document.getElementById('mTitleEn').textContent = `${m.stitchWidth}×${m.stitchHeight} cells · cell ${m.cellSizePx}px · ${m.colors.length} colors`;
  document.getElementById('mMeta').textContent = 'generated · image_to_motif.py';
  document.getElementById('mDesc').textContent = `Source: ${m.source}`;
  const colorSwatches = m.colors.map((c, i) =>
    `#${i} ${c.hexValue}`
  ).join('  ·  ');
  document.getElementById('mConstruct').textContent = colorSwatches;
  const mc = document.getElementById('mCanvas');
  renderJsonMotif(mc, m, cellPxForJsonModal(m));
  modalBg.classList.add('open');
}

function closeModal() {
  modalBg.classList.remove('open');
  activeMotif = null;
  activeJsonMotif = null;
}

document.getElementById('modalClose').addEventListener('click', closeModal);
modalBg.addEventListener('click', e => { if (e.target === modalBg) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ─── INIT ────────────────────────────────────────────────────────────────────
buildCards();
</script>
