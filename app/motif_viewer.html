<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross-Stitch Viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #fff; }

#xsToolbar {
  height: 44px; background: #2c1810; color: #f5f0e8;
  display: flex; align-items: center; padding: 0 16px; gap: 10px; flex-shrink: 0;
}
#xsMotifName {
  font-family: Georgia,serif; font-size: 0.95rem; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#xsZoomPct {
  font-size: 0.75rem; opacity: 0.65; min-width: 46px;
  text-align: right; font-variant-numeric: tabular-nums;
}
.xs-btn {
  padding: 4px 12px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
  background: transparent; color: #f5f0e8; cursor: pointer; font-size: 0.78rem;
}
.xs-btn:hover { background: rgba(255,255,255,0.12); }
.xs-btn.active { background: #8b2020; border-color: #8b2020; }
#xsMain { position: relative; flex: 1; overflow: hidden; }
#xsCanvas { position: absolute; inset: 0; display: block; cursor: grab; }
#xsCanvas.xs-select { cursor: crosshair; }
#xsCanvas.xs-dragging { cursor: grabbing; }
#xsRulerCorner {
  position: absolute; top: 0; left: 0; width: 28px; height: 20px;
  background: rgba(248,248,248,0.94); border-right: 1px solid #ddd;
  border-bottom: 1px solid #ddd; z-index: 5; pointer-events: none;
}
#xsRulerH {
  position: absolute; top: 0; left: 28px; right: 0; height: 20px;
  background: rgba(248,248,248,0.94); border-bottom: 1px solid #ddd;
  overflow: hidden; z-index: 4; pointer-events: none;
}
#xsRulerV {
  position: absolute; top: 20px; left: 0; bottom: 0; width: 28px;
  background: rgba(248,248,248,0.94); border-right: 1px solid #ddd;
  overflow: hidden; z-index: 4; pointer-events: none;
}
.xs-rlbl {
  position: absolute; font-size: 9px; color: #aaa;
  font-family: monospace; user-select: none; line-height: 1;
}
#xsRulerH .xs-rlbl { top: 5px; transform: translateX(-50%); }
#xsRulerV .xs-rlbl { left: 2px; transform: translateY(-50%); }
#xsInfoBar {
  position: absolute;
  background: rgba(44,24,16,0.88); color: #f5f0e8;
  padding: 4px 10px; font-size: 0.75rem; border-radius: 4px;
  display: none; align-items: center; gap: 10px; z-index: 10;
  pointer-events: none; white-space: nowrap;
}
#xsInfoBar.active { display: flex; }
.xs-chip { display: inline-flex; align-items: center; gap: 5px; }
.xs-chip-dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0;
}

#noMotif {
  display: none; position: absolute; inset: 0;
  align-items: center; justify-content: center; flex-direction: column;
  gap: 16px; color: #7a6a5e; font-family: Georgia, serif;
}
#noMotif.visible { display: flex; }
#noMotif a {
  padding: 8px 20px; background: #2c1810; color: #f5f0e8;
  border-radius: 6px; text-decoration: none; font-family: system-ui; font-size: 0.85rem;
}

body { display: flex; flex-direction: column; }

/* ── Color legend ─────────────────────────────────────── */
#xsLegend {
  position: absolute; bottom: 16px; right: 16px;
  background: rgba(30,18,10,0.92); color: #f5f0e8;
  border-radius: 10px; padding: 10px 12px 10px;
  display: none; z-index: 20;
  max-height: calc(100% - 60px); overflow-y: auto;
  box-shadow: 0 4px 24px rgba(0,0,0,0.35);
  backdrop-filter: blur(4px);
  min-width: 160px;
}
#xsLegend.visible { display: block; }
.xs-leg-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px; padding-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.xs-leg-title {
  font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em;
  opacity: 0.45;
}
.xs-leg-toggle-all {
  font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em;
  opacity: 0.55; cursor: pointer; padding: 2px 6px;
  border: 1px solid rgba(255,255,255,0.2); border-radius: 3px;
  background: transparent; color: #f5f0e8;
  transition: opacity 0.1s, background 0.1s;
}
.xs-leg-toggle-all:hover { opacity: 1; background: rgba(255,255,255,0.1); }
.xs-leg-item {
  display: flex; align-items: center; gap: 9px;
  padding: 4px 5px; border-radius: 5px; cursor: pointer;
  transition: background 0.1s, opacity 0.15s; user-select: none;
}
.xs-leg-item:hover { background: rgba(255,255,255,0.1); }
.xs-leg-item.previewing { background: rgba(255,255,255,0.15); }
.xs-leg-item.hidden-color { opacity: 0.3; }
.xs-leg-item.hidden-color .xs-leg-swatch { filter: grayscale(1); }
.xs-leg-swatch {
  width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.2); position: relative;
  cursor: pointer;
}
.xs-leg-swatch:hover { border-color: rgba(255,255,255,0.5); }
.xs-leg-vis {
  margin-left: auto; background: transparent; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.18); border-radius: 3px;
  cursor: pointer; color: rgba(245,240,232,0.45);
  font-size: 0.6rem; padding: 1px 5px; line-height: 1.5;
  font-family: system-ui, sans-serif; text-transform: uppercase;
  letter-spacing: 0.06em; transition: color 0.1s, background 0.1s;
}
.xs-leg-vis:hover { color: rgba(245,240,232,0.9); background: rgba(255,255,255,0.08); }
.xs-leg-item.hidden-color .xs-leg-vis { color: rgba(245,240,232,0.6); }
.xs-leg-item.hidden-color .xs-leg-swatch::after {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(
    -45deg, transparent, transparent 3px,
    rgba(255,255,255,0.5) 3px, rgba(255,255,255,0.5) 4px
  );
  border-radius: 3px;
}
.xs-leg-sym {
  font-family: monospace; font-size: 1rem; font-weight: bold;
  min-width: 16px; text-align: center; line-height: 1;
}
.xs-leg-hex {
  font-family: monospace; font-size: 0.62rem; opacity: 0.45;
  letter-spacing: 0.04em;
}

/* ── Hover color preview ──────────────────────────────── */
#xsColorPreview {
  position: absolute; z-index: 40;
  background: #fff; border-radius: 10px;
  box-shadow: 0 6px 28px rgba(0,0,0,0.35);
  padding: 10px; display: none; pointer-events: none;
  min-width: 130px;
}
#xsColorPreview.visible { display: block; }
#xsColorSwatch { width: 110px; height: 110px; border-radius: 7px; }
#xsColorHex {
  margin-top: 7px; font-size: 0.72rem; color: #666;
  text-align: center; font-family: monospace; letter-spacing: 0.05em;
}

/* ── Click color modal (full-screen swatch for thread matching) */
#xsColorModal {
  position: absolute; inset: 0; z-index: 50;
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 18px;
  background: rgba(0,0,0,0.72); cursor: pointer;
}
#xsColorModal.open { display: flex; }
#xsColorModalSwatch {
  width: min(55vw, 55vh); height: min(55vw, 55vh);
  border-radius: 16px; box-shadow: 0 12px 60px rgba(0,0,0,0.5);
  transition: transform 0.15s;
}
#xsColorModalHex { color: #fff; font-family: monospace; font-size: 1.3rem; letter-spacing: 0.06em; }
#xsColorModalHint { color: rgba(255,255,255,0.4); font-size: 0.75rem; }

/* ── Legend collapse toggle (mobile only) */
.xs-leg-collapse {
  display: none; background: transparent; border: none;
  color: #f5f0e8; cursor: pointer; padding: 0 4px;
  font-size: 1rem; opacity: 0.55; line-height: 1;
  transition: transform 0.2s;
}
.xs-leg-collapse.open { transform: rotate(180deg); }
.xs-leg-items { display: block; }

@media (max-width: 600px) {
  #xsToolbar { height: 56px; gap: 6px; padding: 0 10px; }
  .xs-btn { padding: 10px 12px; font-size: 0.82rem; }
  .xs-btn-zoom { display: inline-block; }
  #xsLegend { bottom: 8px; right: 8px; max-width: calc(100vw - 16px); }
  .xs-leg-swatch { width: 26px; height: 26px; }
  .xs-leg-vis { padding: 3px 8px; font-size: 0.65rem; }

  /* legend collapsed by default on mobile */
  .xs-leg-items { display: none; }
  .xs-leg-items.open { display: block; }
  .xs-leg-collapse { display: inline-flex; align-items: center; }
}
@media (min-width: 601px) {
  .xs-btn-zoom { display: none; }
}
@media (max-width: 400px) {
  #xsZoomPct { display: none; }
}
</style>
</head>
<body>

<div id="xsToolbar">
  <span id="xsMotifName">Cross-Stitch Viewer</span>
  <span id="xsZoomPct">100%</span>
  <button class="xs-btn xs-btn-zoom" id="xsZoomOut">−</button>
  <button class="xs-btn xs-btn-zoom" id="xsZoomIn">+</button>
  <button class="xs-btn" id="xsModeBtn">Select</button>
  <button class="xs-btn" id="xsSymBtn">Symbols</button>
  <button class="xs-btn" id="xsFitBtn">Fit</button>
  <button class="xs-btn" id="xsBackBtn">← Back</button>
</div>
<div id="xsMain">
  <canvas id="xsCanvas"></canvas>
  <div id="xsRulerCorner"></div>
  <div id="xsRulerH"></div>
  <div id="xsRulerV"></div>
  <div id="xsInfoBar"></div>
  <div id="xsLegend">
    <div class="xs-leg-header">
      <span class="xs-leg-title" id="xsLegTitleBtn" style="cursor:pointer">Color legend</span>
      <button class="xs-leg-collapse" id="xsLegCollapse">▾</button>
      <button class="xs-leg-toggle-all" id="xsLegToggleAll">Hide all</button>
    </div>
  </div>
  <div id="xsColorPreview"><div id="xsColorSwatch"></div><div id="xsColorHex"></div></div>
  <div id="xsColorModal">
    <div id="xsColorModalSwatch"></div>
    <div id="xsColorModalHex"></div>
    <div id="xsColorModalHint">tap anywhere to close</div>
  </div>
  <div id="noMotif">
    <span>No motif loaded.</span>
    <a href="/motif_browser.html">← Back to Motif Browser</a>
  </div>
</div>

<script>
(function () {
  const RULER_W = 28, RULER_H = 20;
  const MIN_SCALE = 0.5, MAX_SCALE = 40;
  const GRID_THRESHOLD = 3;
  const X_THRESHOLD = 8;

  let xm = null;
  let panX = 0, panY = 0, scale = 1;
  let mode = 'pan';
  let sel = null;
  let dirty = false;
  let dragState = null;
  let pinchState = null;
  let longPressTimer = null;
  let longPressOrigin = null;

  // ── Symbol mode ──────────────────────────────────────────────────────────────
  let symMode = false;
  let colorSymbols = new Map(); // hex → symbol char
  let hiddenColors = new Set(); // hex colors hidden from canvas

  // Traditional cross-stitch charting symbols
  const SYMBOLS = [
    '×', '✚', '●', '◆', '▲', '■', '★', '✶', '❄', '✿',
    '○', '◇', '△', '□', '☆', '✦', '✱', '✳', '❇', '⊕',
    '⊗', '⊙', '※', '❋', '✵', '✸', '❃', '⊞', '⊠', '✲',
    '▼', '◉', '⊘', '✴', '❆', '✹', '❈', '✾', '❁', '❂',
  ];

  function isNearWhite(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return r > 220 && g > 220 && b > 220;
  }

  function buildColorSymbols() {
    colorSymbols = new Map();
    hiddenColors = new Set(xm.colors.filter(isNearWhite));
    xm.colors.forEach((hex, i) => {
      colorSymbols.set(hex, SYMBOLS[i % SYMBOLS.length]);
    });
  }

  const hasFinePointer = window.matchMedia('(pointer: fine)').matches;

  function buildLegend() {
    const legend = document.getElementById('xsLegend');
    const header = legend.querySelector('.xs-leg-header');
    legend.innerHTML = '';
    legend.appendChild(header);

    const wrap = document.createElement('div');
    wrap.className = 'xs-leg-items';

    colorSymbols.forEach((sym, hex) => {
      const isHidden = hiddenColors.has(hex);
      const item = document.createElement('div');
      item.className = 'xs-leg-item' + (isHidden ? ' hidden-color' : '');
      item.dataset.hex = hex;
      item.innerHTML =
        `<span class="xs-leg-swatch" style="background:${hex}"></span>` +
        `<span class="xs-leg-sym">${sym}</span>` +
        `<span class="xs-leg-hex">${hex}</span>` +
        `<button class="xs-leg-vis">${isHidden ? 'show' : 'hide'}</button>`;
      if (hasFinePointer) {
        item.addEventListener('mouseenter', () => showColorHover(hex, item));
        item.addEventListener('mouseleave', hideColorHover);
      }
      item.querySelector('.xs-leg-swatch').addEventListener('click', e => {
        e.stopPropagation();
        showColorModal(hex);
      });
      item.querySelector('.xs-leg-vis').addEventListener('click', e => {
        e.stopPropagation();
        toggleColorVisibility(hex, item);
      });
      wrap.appendChild(item);
    });

    legend.appendChild(wrap);
    updateToggleAllBtn();
  }

  function toggleColorVisibility(hex, item) {
    const btn = item.querySelector('.xs-leg-vis');
    if (hiddenColors.has(hex)) {
      hiddenColors.delete(hex);
      item.classList.remove('hidden-color');
      if (btn) btn.textContent = 'hide';
    } else {
      hiddenColors.add(hex);
      item.classList.add('hidden-color');
      if (btn) btn.textContent = 'show';
    }
    updateToggleAllBtn();
    markDirty();
  }

  function updateToggleAllBtn() {
    const allHidden = xm.colors.every(h => hiddenColors.has(h));
    document.getElementById('xsLegToggleAll').textContent = allHidden ? 'Show all' : 'Hide all';
  }

  function showColorHover(hex, el) {
    const preview = document.getElementById('xsColorPreview');
    document.getElementById('xsColorSwatch').style.background = hex;
    document.getElementById('xsColorHex').textContent = hex;
    // position to the left of the legend item
    const mainRect = document.getElementById('xsMain').getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    let left = elRect.left - mainRect.left - 140;
    let top  = elRect.top  - mainRect.top;
    if (left < 4) left = elRect.right - mainRect.left + 6;
    preview.style.left = left + 'px';
    preview.style.top  = Math.max(4, top) + 'px';
    preview.classList.add('visible');
    el.classList.add('previewing');
  }

  function hideColorHover() {
    document.getElementById('xsColorPreview').classList.remove('visible');
    document.querySelectorAll('.xs-leg-item.previewing').forEach(el => el.classList.remove('previewing'));
  }

  function showColorModal(hex) {
    const modal = document.getElementById('xsColorModal');
    document.getElementById('xsColorModalSwatch').style.background = hex;
    document.getElementById('xsColorModalHex').textContent = hex;
    modal.classList.add('open');
  }

  function hideColorModal() {
    document.getElementById('xsColorModal').classList.remove('open');
  }

  function loadMotif() {
    const raw = sessionStorage.getItem('xsViewerMotif');
    if (!raw) {
      document.getElementById('noMotif').classList.add('visible');
      return;
    }
    const data = JSON.parse(raw);
    xm = {
      name: data.name,
      cols: data.cols,
      rows: data.rows,
      colors: data.colors,
      bgColor: data.bgColor,
      cell(c, r) {
        return data.colors[Math.min(data.grid[r][c], data.colors.length - 1)];
      }
    };
    document.title = xm.name + ' — Cross-Stitch Viewer';
    document.getElementById('xsMotifName').textContent = xm.name;
    buildColorSymbols();
    buildLegend();
    sizeCanvas();
    fit();
    markDirty();
  }

  function sizeCanvas() {
    const canvas = document.getElementById('xsCanvas');
    const main = document.getElementById('xsMain');
    canvas.width = main.offsetWidth;
    canvas.height = main.offsetHeight;
  }

  function fit() {
    const canvas = document.getElementById('xsCanvas');
    const W = canvas.width, H = canvas.height;
    const pad = 32;
    const availW = W - RULER_W - pad * 2;
    const availH = H - RULER_H - pad * 2;
    scale = Math.min(availW / xm.cols, availH / xm.rows);
    panX = RULER_W + pad + (availW - xm.cols * scale) / 2;
    panY = RULER_H + pad + (availH - xm.rows * scale) / 2;
  }

  function markDirty() {
    if (!dirty) { dirty = true; requestAnimationFrame(render); }
  }

  function render() {
    dirty = false;
    if (!xm) return;
    const canvas = document.getElementById('xsCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cp = scale;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    const c0 = Math.max(0, Math.floor((RULER_W - panX) / cp));
    const c1 = Math.min(xm.cols - 1, Math.ceil((W - panX) / cp));
    const r0 = Math.max(0, Math.floor((RULER_H - panY) / cp));
    const r1 = Math.min(xm.rows - 1, Math.ceil((H - panY) / cp));

    if (cp >= GRID_THRESHOLD) {
      ctx.strokeStyle = '#e8e8e8';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      for (let c = c0; c <= c1 + 1; c++) {
        const x = Math.round(panX + c * cp);
        ctx.moveTo(x, panY + r0 * cp);
        ctx.lineTo(x, panY + (r1 + 1) * cp);
      }
      for (let r = r0; r <= r1 + 1; r++) {
        const y = Math.round(panY + r * cp);
        ctx.moveTo(panX + c0 * cp, y);
        ctx.lineTo(panX + (c1 + 1) * cp, y);
      }
      ctx.stroke();
    }

    const useSym = symMode && cp >= 6;
    const useX   = !useSym && cp >= X_THRESHOLD;

    if (useSym) {
      const fontSize = Math.max(9, Math.min(cp * 0.75, 28));
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
    } else if (useX) {
      ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(1, cp * 0.15);
    }
    const inset = Math.max(1, cp * 0.12);

    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const hex = xm.cell(c, r);
        if (hiddenColors.has(hex)) continue;
        const x = panX + c * cp;
        const y = panY + r * cp;
        if (useSym) {
          // White cell + symbol drawn in thread color
          ctx.fillStyle = '#f7f4ef';
          ctx.fillRect(x + 0.5, y + 0.5, cp - 1, cp - 1);
          ctx.fillStyle = hex;
          ctx.fillText(colorSymbols.get(hex) || '×', x + cp / 2, y + cp / 2);
        } else if (!useX) {
          ctx.fillStyle = hex;
          ctx.fillRect(x, y, cp, cp);
        } else {
          ctx.strokeStyle = hex;
          ctx.beginPath();
          ctx.moveTo(x + inset,      y + inset);
          ctx.lineTo(x + cp - inset, y + cp - inset);
          ctx.moveTo(x + cp - inset, y + inset);
          ctx.lineTo(x + inset,      y + cp - inset);
          ctx.stroke();
        }
      }
    }

    if (sel) {
      const sc = Math.min(sel.c1, sel.c2), ec = Math.max(sel.c1, sel.c2);
      const sr = Math.min(sel.r1, sel.r2), er = Math.max(sel.r1, sel.r2);
      ctx.fillStyle = 'rgba(180,40,40,0.15)';
      ctx.fillRect(panX + sc * cp, panY + sr * cp, (ec - sc + 1) * cp, (er - sr + 1) * cp);
      ctx.strokeStyle = 'rgba(180,40,40,0.75)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(panX + sc * cp, panY + sr * cp, (ec - sc + 1) * cp, (er - sr + 1) * cp);
      positionTooltip();
    }

    ctx.fillStyle = 'rgba(248,248,248,0.94)';
    ctx.fillRect(0, 0, W, RULER_H);
    ctx.fillRect(0, 0, RULER_W, H);

    document.getElementById('xsZoomPct').textContent = Math.round(scale * 100) + '%';
    updateRulers(c0, c1, r0, r1, cp);
  }

  function rulerStep(cp) {
    const minGap = 40;
    const raw = Math.ceil(minGap / cp);
    return [1, 2, 5, 10, 20, 50, 100].find(s => s >= raw) || 100;
  }

  function updateRulers(c0, c1, r0, r1, cp) {
    const rh = document.getElementById('xsRulerH');
    const rv = document.getElementById('xsRulerV');
    const step = rulerStep(cp);

    rh.innerHTML = '';
    const cStart = Math.ceil(c0 / step) * step;
    for (let c = cStart; c <= c1; c += step) {
      const x = panX + c * cp - RULER_W;
      if (x < 0 || x > rh.offsetWidth) continue;
      const el = document.createElement('span');
      el.className = 'xs-rlbl';
      el.style.left = x + 'px';
      el.textContent = c;
      rh.appendChild(el);
    }

    rv.innerHTML = '';
    const rStart = Math.ceil(r0 / step) * step;
    for (let r = rStart; r <= r1; r += step) {
      const y = panY + r * cp - RULER_H;
      if (y < 0 || y > rv.offsetHeight) continue;
      const el = document.createElement('span');
      el.className = 'xs-rlbl';
      el.style.top = y + 'px';
      el.textContent = r;
      rv.appendChild(el);
    }
  }

  function positionTooltip() {
    const bar = document.getElementById('xsInfoBar');
    if (!bar.classList.contains('active') || !sel) return;
    const sc = Math.min(sel.c1, sel.c2), ec = Math.max(sel.c1, sel.c2);
    const sr = Math.min(sel.r1, sel.r2), er = Math.max(sel.r1, sel.r2);
    const canvas = document.getElementById('xsCanvas');
    const cx = panX + (sc + (ec - sc + 1) / 2) * scale;
    const topY = panY + sr * scale - 8;
    const botY = panY + (er + 1) * scale + 8;
    const useBelow = topY < RULER_H + 32;
    bar.style.left = Math.max(4, Math.min(canvas.width - 4, cx)) + 'px';
    bar.style.top = (useBelow ? botY : topY) + 'px';
    bar.style.transform = useBelow ? 'translate(-50%, 0)' : 'translate(-50%, -100%)';
  }

  function updateInfoBar() {
    if (!sel) return;
    const sc = Math.min(sel.c1, sel.c2), ec = Math.max(sel.c1, sel.c2);
    const sr = Math.min(sel.r1, sel.r2), er = Math.max(sel.r1, sel.r2);
    const W = ec - sc + 1, H = er - sr + 1;
    const counts = {};
    for (let r = sr; r <= er; r++) {
      for (let c = sc; c <= ec; c++) {
        const hex = xm.cell(c, r);
        if (hiddenColors.has(hex)) continue;
        counts[hex] = (counts[hex] || 0) + 1;
      }
    }
    const bar = document.getElementById('xsInfoBar');
    let html = `<span>Selected: <b>${W}×${H}</b></span>`;
    for (const [hex, cnt] of Object.entries(counts)) {
      html += `<span class="xs-chip"><span class="xs-chip-dot" style="background:${hex}"></span>${cnt}</span>`;
    }
    bar.innerHTML = html;
    bar.classList.add('active');
    positionTooltip();
  }

  function screenToStitch(sx, sy) {
    return {
      c: Math.max(0, Math.min(xm.cols - 1, Math.floor((sx - panX) / scale))),
      r: Math.max(0, Math.min(xm.rows - 1, Math.floor((sy - panY) / scale)))
    };
  }

  function zoomAt(factor, cx, cy) {
    const sc = (cx - panX) / scale;
    const sr = (cy - panY) / scale;
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
    panX = cx - sc * scale;
    panY = cy - sr * scale;
    markDirty();
  }

  function onWheel(e) {
    if (!xm) return;
    e.preventDefault();
    const rect = e.currentTarget.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - rect.left, e.clientY - rect.top);
  }

  function onMouseDown(e) {
    if (!xm || e.button !== 0) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    if (mode === 'select') {
      const { c, r } = screenToStitch(sx, sy);
      dragState = { type: 'select', startC: c, startR: r };
      sel = { c1: c, r1: r, c2: c, r2: r };
      document.getElementById('xsInfoBar').classList.remove('active');
    } else {
      dragState = { type: 'pan', startX: sx, startY: sy, px0: panX, py0: panY };
    }
    e.currentTarget.classList.add('xs-dragging');
  }

  function onMouseMove(e) {
    if (!dragState || !xm) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    if (dragState.type === 'pan') {
      panX = dragState.px0 + (sx - dragState.startX);
      panY = dragState.py0 + (sy - dragState.startY);
    } else {
      const { c, r } = screenToStitch(sx, sy);
      sel = { c1: dragState.startC, r1: dragState.startR, c2: c, r2: r };
    }
    markDirty();
  }

  function onMouseUp(e) {
    if (!dragState) return;
    const wasSel = dragState.type === 'select';
    dragState = null;
    e.currentTarget.classList.remove('xs-dragging');
    if (wasSel && sel) updateInfoBar();
  }

  function touchDist(t1, t2) {
    return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
  }

  function onTouchStart(e) {
    if (!xm) return;
    e.preventDefault();
    const rect = e.currentTarget.getBoundingClientRect();
    if (e.touches.length === 1) {
      pinchState = null;
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      const sx = e.touches[0].clientX - rect.left;
      const sy = e.touches[0].clientY - rect.top;
      if (mode === 'select') {
        const { c, r } = screenToStitch(sx, sy);
        dragState = { type: 'select', startC: c, startR: r };
        sel = { c1: c, r1: r, c2: c, r2: r };
        document.getElementById('xsInfoBar').classList.remove('active');
      } else {
        dragState = { type: 'pan', startX: sx, startY: sy, px0: panX, py0: panY };
        longPressOrigin = { sx, sy };
        longPressTimer = setTimeout(() => {
          longPressTimer = null;
          const { c, r } = screenToStitch(longPressOrigin.sx, longPressOrigin.sy);
          dragState = { type: 'select', startC: c, startR: r };
          sel = { c1: c, r1: r, c2: c, r2: r };
          document.getElementById('xsInfoBar').classList.remove('active');
          const canvas = document.getElementById('xsCanvas');
          canvas.style.outline = '3px solid rgba(180,40,40,0.5)';
          setTimeout(() => { canvas.style.outline = ''; }, 200);
          if (navigator.vibrate) navigator.vibrate(30);
          markDirty();
        }, 400);
      }
    } else if (e.touches.length === 2) {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      dragState = null;
      const mx = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
      const my = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
      pinchState = {
        dist: touchDist(e.touches[0], e.touches[1]),
        initScale: scale,
        stitchC: (mx - panX) / scale,
        stitchR: (my - panY) / scale
      };
    }
  }

  function onTouchMove(e) {
    if (!xm) return;
    e.preventDefault();
    const rect = e.currentTarget.getBoundingClientRect();
    if (e.touches.length === 2 && pinchState) {
      const dist = touchDist(e.touches[0], e.touches[1]);
      const mx = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
      const my = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
      scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchState.initScale * (dist / pinchState.dist)));
      panX = mx - pinchState.stitchC * scale;
      panY = my - pinchState.stitchR * scale;
      markDirty();
    } else if (e.touches.length === 1 && dragState) {
      const sx = e.touches[0].clientX - rect.left;
      const sy = e.touches[0].clientY - rect.top;
      if (longPressTimer && longPressOrigin) {
        const dx = sx - longPressOrigin.sx, dy = sy - longPressOrigin.sy;
        if (Math.hypot(dx, dy) > 8) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      }
      if (dragState.type === 'pan') {
        panX = dragState.px0 + (sx - dragState.startX);
        panY = dragState.py0 + (sy - dragState.startY);
      } else {
        const { c, r } = screenToStitch(sx, sy);
        sel = { c1: dragState.startC, r1: dragState.startR, c2: c, r2: r };
      }
      markDirty();
    }
  }

  function onTouchEnd(e) {
    e.preventDefault();
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (e.touches.length < 2) pinchState = null;
    if (e.touches.length === 0) {
      const wasSel = dragState && dragState.type === 'select';
      const wasTap = dragState && dragState.type === 'pan' &&
        panX === dragState.px0 && panY === dragState.py0;
      dragState = null;
      longPressOrigin = null;
      if (wasSel && sel) {
        updateInfoBar();
      } else if (wasTap && sel && mode !== 'select') {
        sel = null;
        document.getElementById('xsInfoBar').classList.remove('active');
        markDirty();
      }
    }
  }

  function init() {
    const canvas = document.getElementById('xsCanvas');

    canvas.addEventListener('wheel', onWheel, { passive: false });
    canvas.addEventListener('mousedown', onMouseDown);
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mouseup', onMouseUp);
    canvas.addEventListener('mouseleave', onMouseUp);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });

    document.getElementById('xsBackBtn').addEventListener('click', () => {
      if (history.length > 1) history.back();
      else window.location.href = '/motif_browser.html';
    });

    document.getElementById('xsZoomIn').addEventListener('click', () => {
      if (!xm) return;
      zoomAt(1.5, canvas.width / 2, canvas.height / 2);
    });

    document.getElementById('xsZoomOut').addEventListener('click', () => {
      if (!xm) return;
      zoomAt(1 / 1.5, canvas.width / 2, canvas.height / 2);
    });

    document.getElementById('xsFitBtn').addEventListener('click', () => {
      if (!xm) return;
      sizeCanvas();
      fit();
      markDirty();
    });

    document.getElementById('xsModeBtn').addEventListener('click', () => {
      mode = mode === 'pan' ? 'select' : 'pan';
      const btn = document.getElementById('xsModeBtn');
      btn.textContent = mode === 'select' ? 'Pan' : 'Select';
      btn.classList.toggle('active', mode === 'select');
      canvas.classList.toggle('xs-select', mode === 'select');
      if (mode === 'pan') {
        sel = null;
        document.getElementById('xsInfoBar').classList.remove('active');
        markDirty();
      }
    });

    document.getElementById('xsSymBtn').addEventListener('click', () => {
      symMode = !symMode;
      document.getElementById('xsSymBtn').classList.toggle('active', symMode);
      document.getElementById('xsLegend').classList.toggle('visible', symMode);
      markDirty();
    });

    const modal = document.getElementById('xsColorModal');
    modal.addEventListener('click', hideColorModal);
    modal.addEventListener('touchend', e => { e.preventDefault(); hideColorModal(); }, { passive: false });

    document.addEventListener('touchstart', hideColorHover, { passive: true });

    function toggleLegendCollapse() {
      const wrap = document.querySelector('.xs-leg-items');
      const btn  = document.getElementById('xsLegCollapse');
      if (!wrap) return;
      wrap.classList.toggle('open');
      btn.classList.toggle('open');
    }
    document.getElementById('xsLegCollapse').addEventListener('click', e => { e.stopPropagation(); toggleLegendCollapse(); });
    document.getElementById('xsLegTitleBtn').addEventListener('click', toggleLegendCollapse);

    document.getElementById('xsLegToggleAll').addEventListener('click', e => {
      e.stopPropagation();
      const allHidden = xm.colors.every(h => hiddenColors.has(h));
      if (allHidden) {
        xm.colors.forEach(h => hiddenColors.delete(h));
      } else {
        xm.colors.forEach(h => hiddenColors.add(h));
      }
      document.querySelectorAll('.xs-leg-item').forEach(item => {
        const h = item.dataset.hex;
        const hidden = hiddenColors.has(h);
        item.classList.toggle('hidden-color', hidden);
        const btn = item.querySelector('.xs-leg-vis');
        if (btn) btn.textContent = hidden ? 'show' : 'hide';
      });
      updateToggleAllBtn();
      markDirty();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (document.getElementById('xsColorModal').classList.contains('open')) {
          hideColorModal();
          return;
        }
        if (history.length > 1) history.back();
        else window.location.href = '/motif_browser.html';
      }
      if (e.key === '0' && xm) { sizeCanvas(); fit(); markDirty(); }
    });

    window.addEventListener('resize', () => {
      if (!xm) return;
      sizeCanvas();
      fit();
      markDirty();
    });

    loadMotif();
  }

  if (document.readyState !== 'loading') init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>

document.addEventListener('DOMContentLoaded', function () {
  if (window.innerWidth <= 600) {
    const sb = document.getElementById('_sb');
    if (sb) sb.remove();
    document.body.classList.remove('_sbody', '_scoll');
    document.body.style.paddingLeft = '';
  }
});
